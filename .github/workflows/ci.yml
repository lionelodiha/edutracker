name: ci

on:
  push:
    branches: [main]
  pull_request:

# Pushing twice to a PR should cancel the first run. Without this you pay
# for CI minutes verifying a commit nobody will ever merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only. Individual jobs opt in to more.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json # the pin from Stage 00; CI uses the same SDK as every laptop

      - name: SDK in use
        run: dotnet --list-sdks

      # Cache keyed on the lock inputs. Central package management means
      # Directory.Packages.props is the file that actually decides restore.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-

      - run: dotnet restore edutracker.slnx

      # -warnaserror on CI only. Locally warnings are useful noise;
      # on main they are a decision nobody made.
      - run: dotnet build edutracker.slnx --no-restore -c Release -warnaserror

      - run: dotnet format edutracker.slnx --verify-no-changes

      - run: dotnet test edutracker.slnx --no-build -c Release
               --logger trx
               --collect:"XPlat Code Coverage"

      - uses: actions/upload-artifact@v4
        if: always() # the failing run is when you want these
        with:
          name: test-results
          path: "**/TestResults/**"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/edu-tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/edu-tracker/package-lock.json

      # ci, not install: it honours the lockfile exactly and fails if
      # package.json and the lock have drifted apart.
      - run: npm ci

      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write # push to GHCR from main
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only needed when we actually push. Without this the push from main
      # fails with a 401 while every PR run stays green, so the break would
      # first appear on the merge commit.
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build on every PR to prove the Dockerfile still works, but only
      # push from main. A broken image discovered at deploy time is the
      # most expensive place to discover it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/EduTracker.Api/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    # The one Playwright smoke path: register, create an organization,
    # create a semester, sign out. Runs against a real API + Postgres +
    # Redis, the same topology `docker compose` gives locally.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edutracker
          POSTGRES_PASSWORD: edutracker
          POSTGRES_DB: edutracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edutracker -d edutracker"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:3187
      ConnectionStrings__Database: Host=localhost;Port=5432;Username=edutracker;Password=edutracker;Database=edutracker
      ConnectionStrings__Redis: localhost:6379
      HashingOptions__PasswordWorkFactor: "4" # BCrypt cost; CI does not need production work
      DataEncryptionOptions__CurrentKeyVersion: "1"
      SuperAdminSeedOptions__FirstName: Smoke
      SuperAdminSeedOptions__LastName: Seed
      SuperAdminSeedOptions__UserName: smokeseed
      SuperAdminSeedOptions__Email: seed@example.com
      SuperAdminSeedOptions__Password: Seed!Pass123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/edu-tracker/package-lock.json

      # Ephemeral keys for a scratch database. Generated per run, never
      # committed, never reused: there is nothing here worth stealing.
      - name: Generate ephemeral test keys
        run: |
          echo "DataEncryptionOptions__Keys__1=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "HashingOptions__EmailHmacKey=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build API
        run: dotnet build backend/EduTracker.Api/EduTracker.Api.csproj -c Release

      # The app does not auto-migrate on startup (Stage 04 keeps it that
      # way), so CI applies migrations exactly like a deploy would.
      - name: Apply migrations
        run: dotnet ef database update --project backend/EduTracker.Persistence --startup-project backend/EduTracker.Api

      - name: Start API
        run: |
          dotnet run --project backend/EduTracker.Api --no-build -c Release >"$RUNNER_TEMP/api.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/api.pid"
          for i in $(seq 1 60); do
            # /api/users/me answers 401 without a session; any HTTP answer
            # means the server is up. curl fails while nothing listens.
            if curl -s -o /dev/null http://localhost:3187/api/users/me; then
              echo "API is up"; break
            fi
            sleep 2
          done
          curl -s -o /dev/null http://localhost:3187/api/users/me

      - name: Install frontend dependencies
        working-directory: frontend/edu-tracker
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend/edu-tracker
        run: npx playwright install --with-deps chromium

      - name: Run smoke test
        working-directory: frontend/edu-tracker
        run: npx playwright test

      # The API is running, so regenerate the client against its live
      # OpenAPI document and fail if the checked-in SDK differs. This is
      # the guard that would have caught the Create Department 500: the
      # backend gained a required facultyId, the SDK was never
      # regenerated, so TypeScript could not see the field was missing.
      - name: Check the generated SDK is up to date
        working-directory: frontend/edu-tracker
        run: |
          npm run openapi-ts
          if ! git diff --exit-code -- src/api; then
            echo "::error::The generated API client is stale. Run 'npm run openapi-ts' and commit the result."
            exit 1
          fi

      - name: Stop API and show log on failure
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/api.pid")" || true
          echo "--- api.log ---"
          cat "$RUNNER_TEMP/api.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/edu-tracker/test-results/**
