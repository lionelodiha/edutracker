# Stage 03 — SPA hosting on a non-privileged port (runs without root).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime config is written on every container start and differs per
    # environment. It must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Vite emits hashed filenames under /assets/; safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths serve index.html so client-side routing
    # survives a refresh or deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
